  # LINKS DE PAGAMENTO
  # ─────────────────────────────────────────────────────────────────

  /v1/payment-links:
    post:
      tags: [Links de Pagamento]
      summary: Criar link de pagamento
      description: >
        Cria um novo link de pagamento com checkout pré-configurado e URL única com token de segurança.
        Suporta `CreditCard`, `PIX` e `Boleto`. Compartilhe o campo `url` da resposta diretamente com o cliente.


        O campo `config.image` aceita URL pública HTTPS ou string base64 — processado e armazenado automaticamente (fail-soft:
        se falhar, o link é criado normalmente sem imagem e a resposta incluirá `image_warning`).


        Requer o header `account` com o código da conta.
      operationId: createPaymentLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLinkRequest'
            examples:
              basico:
                summary: Link básico com PIX e cartão
                value:
                  client:
                    name: "Hugo Belo"
                    email: "hugo@exemplo.com.br"
                    phone:
                      ddi: "55"
                      ddd: "62"
                      number: "984063942"
                    document:
                      type: "CPF"
                      number: "71854312120"
                  items:
                    - id: "plano-premium"
                      description: "Plano Mensal Premium"
                      amount: 97.99
                      quantity: 1
                  config:
                    payment_types: ["CreditCard", "PIX"]
                    expires_at: "2026-12-31 23:59:59"
                    max_uses: 100
                    pix_discount_value: 10
                    pix_discount_type: "percentage"
                    redirect_url: "https://meusite.com.br/obrigado"
              com_parcelamento:
                summary: Link com parcelamento e split
                value:
                  client:
                    name: "Ana Lima"
                    email: "ana@exemplo.com.br"
                    phone:
                      ddi: "55"
                      ddd: "11"
                      number: "998765432"
                  items:
                    - id: "curso-001"
                      description: "Curso Completo"
                      amount: 497.00
                      quantity: 1
                  config:
                    payment_types: ["CreditCard", "PIX"]
                    installments:
                      - count: 1
                        interest_rate: 1
                      - count: 6
                        interest_rate: 1.1047
                      - count: 12
                        interest_rate: 1.2
                    split:
                      - receiver_code: "rec_abc123"
                        percentage: 80.00
                      - receiver_code: "rec_xyz456"
                        percentage: 20.00
                    link_name: "Curso Completo – Turma Maio 2026"
                    soft_descriptor: "MeuCurso"
      responses:
        '201':
          description: Link de pagamento criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
              example:
                mensagem: "Link de pagamento criado com sucesso"
                erro: false
                mensagenserro: []
                codigoretorno: 201
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  code: "lnk_abc123xyz"
                  order_code: "ord_abc123xyz"
                  token: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                  url: "https://checkout.4seletpay.com.br/lnk_abc123xyz?token=a1b2c3d4e5f6..."
                  status: "InProgress"
                  payment_types: ["CreditCard", "PIX"]
                  installments:
                    - count: 1
                      interest_rate: 1
                    - count: 2
                      interest_rate: 1
                  obfuscate_client: false
                  obfuscate_items: false
                  expires_at: "2026-12-31T23:59:59.000000Z"
                  max_uses: 100
                  uses_count: 0
                  split: []
                  value: 97.99
                  created_at: "2026-05-27T10:00:00.000000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    get:
      tags: [Links de Pagamento]
      summary: Listar links de pagamento
      description: >
        Retorna a lista paginada de links de pagamento da conta informada no header `account`.
        A resposta segue o formato padrão de paginação do Laravel (diferente do envelope APIReturnUtil das demais rotas).
      operationId: listPaymentLinks
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: page
          in: query
          required: false
          description: Número da página
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          description: Quantidade de itens por página
          schema:
            type: integer
            default: 15
            example: 15
      responses:
        '200':
          description: Lista de links de pagamento retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentLinkData'
                  current_page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 15
                  total:
                    type: integer
                    example: 42
                  last_page:
                    type: integer
                    example: 3
