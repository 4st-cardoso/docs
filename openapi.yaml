        account_code:
          type: string
          description: Código da conta que realizou o bloqueio
          example: "acc_abc123"
        email:
          type: string
          nullable: true
          description: E-mail bloqueado (nulo se bloqueio por CPF)
          example: "spam@exemplo.com.br"
        document:
          type: string
          nullable: true
          description: CPF formatado (nulo se bloqueio por e-mail)
          example: "123.456.789-09"
        type_document:
          type: string
          nullable: true
          description: Tipo do documento bloqueado
          example: CPF
        type:
          type: string
          description: Tipo de bloqueio (Manual, Automatic, etc.)
          example: "Manual"
        created_at:
          type: string
          format: date-time
          example: "2026-02-15T10:30:00.000000Z"

