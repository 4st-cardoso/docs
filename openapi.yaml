openapi: 3.1.0
info:
  title: 4Selet Pay API
  description: >
    API de processamento de pagamentos da plataforma 4Selet Pay.
    Suporta cobranças únicas, assinaturas recorrentes, PIX, Cartão de Crédito.
    Todas as rotas autenticadas requerem um Bearer Token obtido via `/v1/login`.
  version: 1.0.0
  contact:
    name: 4Selet Pay
    email: suporte@4selet.com.br

servers:
  - url: https://sandbox.4seletpay.com.br/api
    description: Servidor de Sandbox

security:
  - bearerAuth: []

tags:
  - name: Autenticação
    description: Rotas de autenticação e criação de usuários
  - name: Cobranças
    description: Criação, consulta, cancelamento e reembolso de cobranças
  - name: Pedidos
    description: Consulta de pedidos e gerenciamento de confirmações desafiadas
  - name: Cartões
    description: Cadastro e gerenciamento dos cartões salvos de um cliente
  - name: Assinaturas
    description: Criação e gerenciamento de assinaturas recorrentes
  - name: Faturas
    description: Gerenciamento de faturas e pagamento de faturas em atraso
  - name: Clientes Bloqueados
    description: Gerenciamento de lista negra de clientes
  - name: Contas
    description: Criação e gerenciamento de contas na plataforma
  - name: Aplicativo
    description: Endpoints para dashboard e uso via aplicativo mobile
  - name: Notificações Push
    description: Envio e gerenciamento de notificações push
  - name: Utilitários
    description: Endpoints utilitários como listagem de fusos horários
  - name: Gestão
    description: Relatórios gerenciais (acesso restrito a Super Admins)
  - name: Webhooks
    description: Endpoints para receber notificações de gateways de pagamento
  - name: Endpoints de Webhook
    description: Gerenciamento de endpoints de webhook para receber notificações de eventos da plataforma
  - name: Links de Pagamento
    description: Criação e gerenciamento de links de pagamento com checkout pré-configurado
  - name: Análise de Fraude
    description: API de Risco — consulta o risco de fraude de uma transação (autenticada por chave de API)

paths:

  # ─────────────────────────────────────────────────────────────────
  # AUTENTICAÇÃO
  # ─────────────────────────────────────────────────────────────────

  /v1/check:
    get:
      tags: [Autenticação]
      summary: Verificar status da API
      description: Retorna uma mensagem confirmando que a API está em funcionamento. Útil para health checks.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: API em funcionamento
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: API is running
              example:
                message: API is running

  /v1/login:
    post:
      tags: [Autenticação]
      summary: Realizar login
      description: >
        Autentica o usuário com email e senha e retorna um Bearer Token para uso nas demais rotas.
        O token tem prazo de expiração informado na resposta.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: usuario@exemplo.com.br
              password: "suaSenha123"
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
                token_type: Bearer
                expires_at: "2026-04-11T12:00:00.000000Z"
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Invalid Credentials
        '422':
          $ref: '#/components/responses/ValidationError'

  # ─────────────────────────────────────────────────────────────────
  # COBRANÇAS
  # ─────────────────────────────────────────────────────────────────

  /v1/charge:
    post:
      tags: [Cobranças]
      summary: Criar cobrança
      description: >
        Cria uma nova cobrança (pedido de pagamento). Suporta os métodos de pagamento:
        **CreditCard**, **PIX**.
        Requer o header `account` com o código da conta.
        Passa por validações de fraude, bloqueio de clientes e rate limiting.


        Possíveis cenários de resposta:

        - **201** — Cobrança processada com sucesso (aprovada ou aguardando pagamento PIX)

        - **202** — Transação desafiada (requer confirmação adicional via OTP)

        - **400** — Fraude detectada ou erro no processamento do gateway

        - **422** — Erro de validação dos dados enviados
      operationId: createCharge
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              cartao_credito:
                summary: Pagamento com Cartão de Crédito
                value:
                  international: false
                  client:
                    name: "João Silva"
                    email: "joao@exemplo.com.br"
                    gender: "Male"
                    birthdate: "1990-01-15"
                    phone:
                      ddi: "55"
                      ddd: "11"
                      number: "999999999"
                    document:
                      type: "CPF"
                      number: "123.456.789-09"
                    address:
                      zipcode: "01310-100"
                      street: "Avenida Paulista"
                      number: 1000
                      neighborhood: "Bela Vista"
                      complement: "Apto 42"
                      city: "São Paulo"
                      state: "SP"
                      country: "Brasil"
                  payment:
                    type: CreditCard
                    card:
                      number: "4111111111111111"
                      name: "JOAO SILVA"
                      month: "12"
                      year: "27"
                      security_code: "123"
                      installments: 1
                      soft_descriptor: "MINHA LOJA"
                  items:
                    - id: "produto_001"
                      description: "Camiseta Premium"
                      amount: 99.90
                      quantity: 2
              cartao_credito_salvo:
                summary: Pagamento com cartão salvo (card_token)
                value:
                  client:
                    name: "João Silva"
                    email: "joao@exemplo.com.br"
                    phone:
                      ddi: "55"
                      ddd: "11"
                      number: "999999999"
                    document:
                      type: "CPF"
                      number: "123.456.789-09"
                  payment:
                    type: CreditCard
                    card:
                      card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                      installments: 1
                  items:
                    - id: "produto_001"
                      description: "Camiseta Premium"
                      amount: 99.90
                      quantity: 2
              pix:
                summary: Pagamento com PIX
                value:
                  international: false
                  client:
                    name: "Maria Santos"
                    email: "maria@exemplo.com.br"
                    phone:
                      ddi: "55"
                      ddd: "21"
                      number: "988887777"
                    document:
                      type: "CPF"
                      number: "987.654.321-00"
                  payment:
                    type: PIX
                    pix_expiration: 3600
                  items:
                    - id: "curso_001"
                      description: "Curso Online"
                      amount: 297.00
                      quantity: 1
      responses:
        '201':
          description: Cobrança processada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeCreateResponse'
              example:
                mensagem: "Cobrança realizada com sucesso."
                erro: false
                mensagenserro: []
                codigoretorno: 201
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                data:
                  charge_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  charge_created_at: "11/03/2026 10:00:00"
                  account_id: 1
                  code: "pur_abc123xyz"
                  value: 199.80
                  charge_value: 199.80
                  coin: "BRL"
                  status: "Approved"
                  client:
                    code: "cli_abc123"
                    name: "João Silva"
                    email: "joao@exemplo.com.br"
                  orders:
                    - code: "ord_abc123xyz"
                      status: "Approved"
                      value: 199.80
                      charges:
                        - code: "chg_abc123"
                          status: "Approved"
                          value: 199.80
                          installments: 1
                          payment:
                            payment_type: "CreditCard"
                            installments: 1
                            card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
        '202':
          description: Transação desafiada — requer confirmação adicional (OTP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeCreateResponse'
              example:
                mensagem: "A transação necessita de confirmação..."
                erro: false
                mensagenserro: []
                codigoretorno: 202
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  charge_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  status: "Challenged"
                  orders:
                    - code: "ord_abc123xyz"
                      status: "Challenged"
                      confirmation_codes:
                        - id: "conf_xyz789"
                          type: "OTP"
                          status: "Pending"
                          expires_at: "2026-03-11T10:15:00.000000Z"
        '400':
          description: Fraude detectada ou erro no gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensagem: "Não foi possível concluir sua transação."
                erro: true
                mensagenserro:
                  - "Verifique as informações e tente novamente."
                codigoretorno: 400
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    get:
      tags: [Cobranças]
      summary: Listar cobranças
      description: >
        Retorna a lista paginada de cobranças da conta informada no header `account`.
        A resposta segue o formato padrão de paginação do Laravel (não é envelopada pelo formato APIReturnUtil).
      operationId: listCharges
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: page
          in: query
          required: false
          description: Número da página (gerenciado automaticamente pelo paginador Laravel)
          schema:
            type: integer
            default: 1
            example: 1
        - name: per_page
          in: query
          required: false
          description: Quantidade de itens por página
          schema:
            type: integer
            default: 10
            example: 10
        - name: search
          in: query
          required: false
          description: Texto para busca nos campos da listagem
          schema:
            type: string
            example: "joao"
        - name: id
          in: query
          required: false
          description: Filtrar por ID específico da cobrança
          schema:
            type: string
            example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        - name: with_trashed
          in: query
          required: false
          description: Incluir registros soft-deleted (1 = sim, 0 = não)
          schema:
            type: integer
            enum: [0, 1]
            default: 0
            example: 0
        - name: trashed_only
          in: query
          required: false
          description: Retornar apenas registros soft-deleted (1 = sim, 0 = não)
          schema:
            type: integer
            enum: [0, 1]
            default: 0
            example: 0
      responses:
        '200':
          description: Lista de cobranças retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChargesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/charge/{code}:
    get:
      tags: [Cobranças]
      summary: Consultar cobrança
      description: >
        Retorna os detalhes completos de uma cobrança específica pelo seu código.
        Os dados são cacheados para melhor performance.
      operationId: getCharge
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: code
          in: path
          required: true
          description: Código único da cobrança
          schema:
            type: string
            example: "chg_abc123"
      responses:
        '200':
          description: Dados da cobrança retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeConsultResponse'
              example:
                mensagem: "Charge found"
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  charge_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  charge_created_at: "11/03/2026 10:00:00"
                  account_id: 1
                  code: "pur_abc123xyz"
                  value: 199.80
                  charge_value: 199.80
                  coin: "BRL"
                  status: "Approved"
                  client:
                    code: "cli_abc123"
                    name: "João Silva"
                    email: "joao@exemplo.com.br"
                    documents:
                      - type: "CPF"
                        number: "123.456.789-09"
                        default: true
                    phone:
                      - ddi: "55"
                        ddd: "11"
                        number: "999999999"
                        default: true
                    addresss:
                      - zipcode: "01310-100"
                        street: "Avenida Paulista"
                        number: "1000"
                        neighborhood: "Bela Vista"
                        city: "São Paulo"
                        state: "SP"
                  orders:
                    - code: "ord_abc123xyz"
                      status: "Approved"
                      value: 199.80
                      error_message: null
                      items:
                        - code: "produto_001"
                          name: "Camiseta Premium"
                          unitary_value: 99.90
                          quantity: 2
                      charges:
                        - code: "chg_abc123"
                          status: "Approved"
                          value: 199.80
                          canceled_amount: 0
                          nsu: "123456789"
                          installments: 1
                          attempts: 1
                          payment:
                            code: null
                            copy_paste: null
                            expiration: null
                            payment_type: "CreditCard"
                            installments: 1
                            card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                          last_transaction:
                            transaction_id: "txn_abc123"
                            type: "Authorization"
                            status_code: "00"
                            nsu: "123456789"
                            event_date: "2026-03-11T10:00:00.000000Z"
                            message_acquisition: "Transação autorizada"
                          historics: []
                          card:
                            id: "card_abc123"
                            name: "JOAO SILVA"
                            type: "credit"
                            number: "411111****1111"
                            flag: "visa"
                      confirmation_codes: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/charge/cancel/{code}:
    post:
      tags: [Cobranças]
      summary: Cancelar cobrança
      description: >
        Cancela uma cobrança existente que ainda não foi finalizada.
        Esta rota não aceita body — apenas o código da cobrança no path.
      operationId: cancelCharge
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: code
          in: path
          required: true
          description: Código único da cobrança a ser cancelada
          schema:
            type: string
            example: "chg_abc123"
      responses:
        '200':
          description: Cobrança cancelada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                mensagem: "Charge chg_abc123 successfully canceled"
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/charge/refund/{code}:
    post:
      tags: [Cobranças]
      summary: Estornar cobrança
      description: >
        Realiza o estorno (reembolso) de uma cobrança aprovada.
        O campo `value` no body é opcional; se não informado, o estorno é total.
        O valor deve ser enviado em **centavos**.
      operationId: refundCharge
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: code
          in: path
          required: true
          description: Código único da cobrança a ser estornada
          schema:
            type: string
            example: "chg_abc123"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: integer
                  description: >
                    Valor a ser estornado em centavos (opcional).
                    Se omitido, o estorno é total.
                    Ex: para estornar R$ 50,00, envie 5000.
                  example: 5000
            example:
              value: 5000
      responses:
        '200':
          description: Estorno realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                mensagem: "Cobrança chg_abc123 estornada com sucesso"
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '400':
          description: Erro no estorno (cobrança já estornada ou valor excede o disponível)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ja_estornada:
                  summary: Cobrança já estornada por completo
                  value:
                    mensagem: "Um erro inesperado acabou de acontecer."
                    erro: true
                    mensagenserro: []
                    codigoretorno: 400
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
                valor_excede:
                  summary: Valor excede o disponível para estorno
                  value:
                    mensagem: "Um erro inesperado acabou de acontecer."
                    erro: true
                    mensagenserro: []
                    codigoretorno: 400
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────
  # PEDIDOS
  # ─────────────────────────────────────────────────────────────────

  /v1/orders/{order_code}/confirmations:
    get:
      tags: [Pedidos]
      summary: Listar confirmações do pedido
      description: >
        Retorna a lista de confirmações (desafios de segurança) associadas a um pedido,
        ordenadas por data de criação (mais recente primeiro).
        Usado quando um pedido entra no status **Challenged** e requer verificação adicional (ex: OTP).
        Esta rota NÃO retorna o envelope padrão APIReturnUtil; retorna diretamente `{"data": [...]}`.
      operationId: getOrderConfirmations
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: order_code
          in: path
          required: true
          description: Código único do pedido
          schema:
            type: string
            example: "ord_abc123xyz"
      responses:
        '200':
          description: Lista de confirmações retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmationsResponse'
              example:
                data:
                  - id: "d5e6f7a8-b9c0-1234-5678-abcdef012345"
                    type: "otp"
                    status: "pending"
                    expires_at: "2026-03-11T10:15:00.000000Z"
        '400':
          description: Pedido não encontrado ou não pertence à conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensagem: "Um erro inesperado acabou de acontecer."
                erro: true
                mensagenserro:
                  - "Pedido não encontrado."
                codigoretorno: 400
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/orders/{order_code}/confirmations/{confirmation_id}/verify:
    post:
      tags: [Pedidos]
      summary: Verificar confirmação do pedido
      description: >
        Verifica/valida uma confirmação de pedido desafiado submetendo o código OTP recebido pelo cliente.
        Ao confirmar com sucesso, as cobranças pendentes do pedido são processadas.
        A resposta segue o mesmo formato da criação de cobrança (envelope APIReturnUtil com dados de consulta).
      operationId: verifyOrderConfirmation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: order_code
          in: path
          required: true
          description: Código único do pedido
          schema:
            type: string
            example: "ord_abc123xyz"
        - name: confirmation_id
          in: path
          required: true
          description: ID (UUID) da confirmação a ser verificada
          schema:
            type: string
            format: uuid
            example: "d5e6f7a8-b9c0-1234-5678-abcdef012345"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Código de verificação OTP recebido pelo cliente
                  example: "123456"
            example:
              code: "123456"
      responses:
        '201':
          description: Cobrança processada com sucesso após confirmação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeCreateResponse'
        '400':
          description: >
            Erro de validação, pedido não encontrado, confirmação inválida,
            pedido não está em status Challenged, ou erro no processamento da cobrança.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation_error:
                  summary: Erro de validação (code ausente)
                  value:
                    mensagem: "Um erro inesperado acabou de acontecer."
                    erro: true
                    mensagenserro:
                      - "O campo code é obrigatório."
                    codigoretorno: 400
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
                order_not_found:
                  summary: Pedido não encontrado
                  value:
                    mensagem: "Um erro inesperado acabou de acontecer."
                    erro: true
                    mensagenserro:
                      - "Pedido não encontrado."
                    codigoretorno: 400
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
                confirmation_not_found:
                  summary: Confirmação não encontrada ou código inválido
                  value:
                    mensagem: "Um erro inesperado acabou de acontecer."
                    erro: true
                    mensagenserro:
                      - "Confirmação não encontrada."
                    codigoretorno: 400
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
                not_challenged:
                  summary: Pedido não está aguardando confirmação
                  value:
                    mensagem: "Um erro inesperado acabou de acontecer."
                    erro: true
                    mensagenserro:
                      - "O pedido não está aguardando confirmação."
                    codigoretorno: 400
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
                no_pending_charges:
                  summary: Nenhuma cobrança pendente
                  value:
                    mensagem: "Um erro inesperado acabou de acontecer."
                    erro: true
                    mensagenserro:
                      - "Nenhuma cobrança pendente foi encontrada para este pedido."
                    codigoretorno: 400
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/orders/{order_code}/confirmations/{confirmation_id}/resend:
    post:
      tags: [Pedidos]
      summary: Reenviar confirmação do pedido
      description: >
        Reenvia o código de confirmação para o cliente (novo OTP por SMS/email).
        Invalidar confirmações pendentes anteriores e gera um novo código com validade de 15 minutos.
        Esta rota não aceita body.
      operationId: resendOrderConfirmation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: order_code
          in: path
          required: true
          description: Código único do pedido
          schema:
            type: string
            example: "ord_abc123xyz"
        - name: confirmation_id
          in: path
          required: true
          description: ID (UUID) da confirmação
          schema:
            type: string
            format: uuid
            example: "d5e6f7a8-b9c0-1234-5678-abcdef012345"
      responses:
        '201':
          description: Confirmação reenviada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                mensagem: "Confirmação reenviada com sucesso."
                erro: false
                mensagenserro: []
                codigoretorno: 201
                id: "d5e6f7a8-b9c0-1234-5678-abcdef012345"
                data: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido ou confirmação não encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order_not_found:
                  summary: Pedido não encontrado
                  value:
                    mensagem: "Um erro aconteceu."
                    erro: true
                    mensagenserro:
                      - "Pedido não encontrado."
                    codigoretorno: 404
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []
                confirmation_not_found:
                  summary: Confirmação não encontrada
                  value:
                    mensagem: "Um erro aconteceu."
                    erro: true
                    mensagenserro:
                      - "Confirmação não encontrada."
                    codigoretorno: 404
                    id: "00000000-0000-0000-0000-000000000000"
                    data: []

  # ─────────────────────────────────────────────────────────────────
  # CARTÕES
  # ─────────────────────────────────────────────────────────────────

  /v1/clients/{clientCode}/cards:
    get:
      tags: [Cartões]
      summary: Listar cartões
      description: >
        Retorna todos os cartões salvos do cliente, do mais recente para o mais antigo,
        no campo `data.cards`. O número completo (PAN) e o CVV nunca são retornados.
        Requer o header `account` com o código da conta.
      operationId: listClientCards
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ClientCode'
      responses:
        '200':
          description: Lista de cartões retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaoListResponse'
              example:
                mensagem: "Cartões listados com sucesso."
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  cards:
                    - id: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                      card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                      first_six_digits: "542501"
                      last_four_digits: "8229"
                      brand: "amex"
                      holder_name: "Tony Stark"
                      exp_month: 1
                      exp_year: 2030
                      type: "credit"
                      status: "active"
                      tokenization_status: "tokenized"
                      created_at: "2026-03-28T22:09:43-03:00"
                      updated_at: "2026-03-28T22:09:43-03:00"
                    - id: "1a7d3f90-6b2c-4e18-9a5f-7c8e2d1b4a3c"
                      card_token: "1a7d3f90-6b2c-4e18-9a5f-7c8e2d1b4a3c"
                      first_six_digits: "411193"
                      last_four_digits: "6203"
                      brand: "visa"
                      holder_name: "Tony Stark"
                      exp_month: 1
                      exp_year: 2030
                      type: "credit"
                      status: "active"
                      tokenization_status: "tokenized"
                      created_at: "2026-03-29T22:09:43-03:00"
                      updated_at: "2026-03-29T22:09:43-03:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/clients/{clientCode}/cards/{cardId}:
    get:
      tags: [Cartões]
      summary: Consultar cartão
      description: >
        Retorna os dados de um cartão específico do cliente pelo seu `id` (UUID).
        O número completo (PAN) e o CVV nunca são retornados.
        Requer o header `account` com o código da conta.
      operationId: getClientCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ClientCode'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Dados do cartão retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaoResponse'
              example:
                mensagem: "Cartão encontrado."
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  id: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  first_six_digits: "542501"
                  last_four_digits: "7793"
                  brand: "mastercard"
                  holder_name: "Tony Stark"
                  exp_month: 1
                  exp_year: 2030
                  type: "credit"
                  status: "active"
                  tokenization_status: "tokenized"
                  created_at: "2026-05-27T10:00:00-03:00"
                  updated_at: "2026-05-27T10:00:00-03:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Cartões]
      summary: Atualizar cartão
      description: >
        Atualiza os dados editáveis de um cartão. Apenas `name`, `type`, `flag` e a validade
        (`month` + `year`, enviados juntos) podem ser alterados. O número e o código de segurança
        são imutáveis. Ao alterar a validade, a tokenização do cartão é reiniciada e o resultado
        é enviado por webhook (`card.token_created` / `card.token_failed`). Um evento
        `card.updated` é emitido a cada atualização. Requer o header `account` com o código da conta.
      operationId: updateClientCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ClientCode'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartaoRequest'
            example:
              name: "Peter Parker"
              month: 12
              year: 2030
      responses:
        '200':
          description: Cartão atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaoResponse'
              example:
                mensagem: "Cartão atualizado com sucesso."
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  id: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  first_six_digits: "542501"
                  last_four_digits: "7793"
                  brand: "mastercard"
                  holder_name: "Peter Parker"
                  exp_month: 12
                  exp_year: 2030
                  type: "credit"
                  status: "active"
                  tokenization_status: "tokenized"
                  created_at: "2026-04-03T20:54:58-03:00"
                  updated_at: "2026-04-04T12:25:32-03:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Cartões]
      summary: Excluir cartão
      description: >
        Remove um cartão (soft delete): o registro passa a ter `status` `deleted` com `deleted_at`
        preenchido, e seus tokens são removidos. Um cartão vinculado a uma assinatura
        ativa não pode ser excluído (retorna `409 Conflict`). Um evento `card.deleted` é emitido.
        Requer o header `account` com o código da conta.
      operationId: deleteClientCard
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ClientCode'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Cartão excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaoResponse'
              example:
                mensagem: "Cartão removido com sucesso."
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  id: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  first_six_digits: "542501"
                  last_four_digits: "7793"
                  brand: "mastercard"
                  holder_name: "Tony Stark"
                  exp_month: 1
                  exp_year: 2030
                  type: "credit"
                  status: "deleted"
                  tokenization_status: "tokenized"
                  created_at: "2026-04-04T12:43:16-03:00"
                  updated_at: "2026-04-04T12:43:30-03:00"
                  deleted_at: "2026-04-04T12:43:30-03:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cartão vinculado a uma assinatura ativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensagem: "Não foi possível remover o cartão."
                erro: true
                mensagenserro:
                  - "Este cartão está vinculado a uma assinatura ativa e não pode ser removido. Altere o cartão da assinatura primeiro."
                codigoretorno: 409
                id: "00000000-0000-0000-0000-000000000000"
                data: []

  /v1/clients/{clientCode}/cards/tokens:
    post:
      tags: [Cartões]
      summary: Salvar cartão
      description: >
        Salva um cartão para o cliente e inicia sua tokenização. A resposta retorna
        imediatamente com `tokenization_status: "pending"`; o resultado da tokenização é
        entregue de forma assíncrona por webhook (`card.token_created` em caso de sucesso ou
        `card.token_failed` caso o cartão não possa ser tokenizado). Um evento `card.created`
        também é emitido ao salvar o cartão.


        O número completo (PAN) e o CVV nunca são retornados — apenas os seis primeiros e os
        quatro últimos dígitos. Aceita o header opcional `Idempotency-Key` para evitar
        cadastros duplicados em retentativas. Requer o header `account` com o código da conta.
      operationId: createClientCardToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - $ref: '#/components/parameters/ClientCode'
        - name: Idempotency-Key
          in: header
          required: false
          description: Chave de idempotência para evitar cadastros duplicados (máx. 128 caracteres)
          schema:
            type: string
            example: "a1b2c3d4-idem-key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartaoRequest'
            example:
              name: "Tony Stark"
              number: "5425011234567793"
              month: 1
              year: 2030
              security_code: "123"
              type: "credit"
              flag: "mastercard"
      responses:
        '202':
          description: Cartão recebido; tokenização iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartaoResponse'
              example:
                mensagem: "Cartão recebido. A tokenização foi iniciada; o resultado será enviado por webhook."
                erro: false
                mensagenserro: []
                codigoretorno: 202
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  id: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  card_token: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
                  first_six_digits: "542501"
                  last_four_digits: "7793"
                  brand: "mastercard"
                  holder_name: "Tony Stark"
                  exp_month: 1
                  exp_year: 2030
                  type: "credit"
                  status: "active"
                  tokenization_status: "pending"
                  created_at: "2026-05-27T10:00:00-03:00"
                  updated_at: "2026-05-27T10:00:00-03:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  # ─────────────────────────────────────────────────────────────────
  # ASSINATURAS
  # ─────────────────────────────────────────────────────────────────

  /v1/subscriptions:
    post:
      tags: [Assinaturas]
      summary: Criar assinatura
      description: >
        Cria uma nova assinatura recorrente para um cliente. Suporta os métodos de pagamento:
        **CreditCard** e **PIX**.
        O campo `subscription.interval` define o ciclo em dias (ex: 30 para mensal).
        Requer o header `account` com o código da conta.
        Passa por validações de fraude, bloqueio de clientes e rate limiting.
      operationId: createSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSubscriptionRequest'
            example:
              international: false
              client:
                client_ip: "192.168.1.100"
                name: "Carlos Ferreira"
                email: "carlos@exemplo.com.br"
                gender: "Male"
                birthdate: "1985-06-20"
                phone:
                  ddi: 55
                  ddd: 11
                  number: "977776666"
                document:
                  type: "CPF"
                  number: "111.222.333-44"
                address:
                  zipcode: "04538-132"
                  street: "Rua Fidêncio Ramos"
                  number: 302
                  neighborhood: "Vila Olímpia"
                  complement: "Torre B"
                  city: "São Paulo"
                  state: "SP"
                  country: "Brasil"
              subscription:
                interval: 30
                code: "plano_mensal_001"
                description: "Plano Mensal Premium"
                installments: 1
                max_invoices: 12
                minimum_price: 9990
                billing_type: "prepaid"
                discounts:
                  cycles: 1
                  value: 10.0
                  type: "percentage"
                metadata:
                  origem: "site"
              payment:
                type: CreditCard
                card:
                  number: "4111111111111111"
                  name: "CARLOS FERREIRA"
                  month: "08"
                  year: "28"
                  security_code: "456"
              items:
                - id: "plano_premium"
                  description: "Acesso Premium Mensal"
                  amount: 99.90
                  quantity: 1
      responses:
        '200':
          description: Assinatura criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/subscriptions/cancel/{subscription_code}:
    put:
      tags: [Assinaturas]
      summary: Cancelar assinatura
      description: >
        Cancela uma assinatura ativa (status `Recurring`).
        A assinatura passa para o status `RecurringCanceled` e não será renovada.
        Esta rota não aceita body.
      operationId: cancelSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: subscription_code
          in: path
          required: true
          description: Código único da assinatura
          schema:
            type: string
            example: "sub_abc123"
      responses:
        '200':
          description: Assinatura cancelada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                mensagem: "Assinatura cancelada com sucesso"
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Assinatura não pertence à conta informada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensagem: "Um erro inesperado acabou de acontecer."
                erro: true
                mensagenserro:
                  - "O código da assinatura não é válido"
                codigoretorno: 403
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '404':
          description: Assinatura não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensagem: "Um erro aconteceu."
                erro: true
                mensagenserro:
                  - "Assinatura não encontrada"
                codigoretorno: 404
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '422':
          description: Assinatura não está ativa (não está em status Recurring)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensagem: "Um erro aconteceu."
                erro: true
                mensagenserro:
                  - "A assinatura não está ativa"
                codigoretorno: 422
                id: "00000000-0000-0000-0000-000000000000"
                data: []

  /v1/subscriptions/change-card/{subscription_code}:
    put:
      tags: [Assinaturas]
      summary: Alterar cartão da assinatura
      description: >
        Substitui o cartão de crédito vinculado a uma assinatura ativa (status `Recurring`).
