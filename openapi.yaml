            order_code:
              type: string
              example: "ord_abc123xyz"
            message_acquisition:
              type: string
              example: "Transação autorizada"
            return_code:
              type: string
              example: "00"
            return_message:
              type: string
              example: "Sucesso"
            amount:
              type: number
              nullable: true
              example: 19980
        historics:
          type: array
          description: Histórico de transações da cobrança
          items:
            type: object
            properties:
              transaction_id:
                type: string
              type:
                type: string
              status_code:
                type: string
              nsu:
                type: string
              tid:
                type: string
              event_date:
                type: string
                format: date-time
              order_code:
                type: string
              message_acquisition:
                type: string
              return_code:
                type: string
              return_message:
                type: string
