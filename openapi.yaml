        codigoretorno:
          type: integer
          example: 400
        id:
          type: string
          example: "00000000-0000-0000-0000-000000000000"
        data:
          type: array
          example: []

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "The given data was invalid."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            "client.email":
              - "O campo client.email é obrigatório."
            "payment.type":
              - "O campo payment.type é obrigatório."

