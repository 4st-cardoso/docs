          type: array
          description: Telefones do cliente (filtrado pelo telefone padrão)
          items:
            type: object
            properties:
              ddi:
                type: string
                example: "55"
              ddd:
                type: string
                example: "11"
              number:
                type: string
                example: "999999999"
              default:
                type: boolean
                example: true
        addresss:
          type: array
          description: Endereços do cliente (filtrado pelo endereço padrão)
          items:
            type: object
            properties:
              zipcode:
                type: string
                example: "01310-100"
              street:
                type: string
                example: "Avenida Paulista"
              number:
                type: string
                example: "1000"
              neighborhood:
                type: string
                example: "Bela Vista"
              city:
                type: string
                example: "São Paulo"
              state:
                type: string
                example: "SP"

