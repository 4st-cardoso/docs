                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  code: "lnk_abc123xyz"
                  order_code: "ord_abc123xyz"
                  token: "a1b2c3d4e5f6..."
                  url: "https://checkout.4seletpay.com.br/lnk_abc123xyz?token=a1b2c3d4e5f6..."
                  status: "InProgress"
                  payment_types: ["CreditCard", "PIX"]
                  installments: []
                  obfuscate_client: false
                  obfuscate_items: false
                  expires_at: "2026-12-31T23:59:59.000000Z"
                  max_uses: 100
                  uses_count: 7
                  split: []
                  value: 97.99
                  created_at: "2026-05-27T10:00:00.000000Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Links de Pagamento]
      summary: Excluir link de pagamento
      description: >
        Remove permanentemente um link de pagamento.
        Links ativos são cancelados automaticamente antes da exclusão.
        Esta operação é irreversível — pagamentos já realizados via este link não são afetados.
        Requer o header `account` com o código da conta.
      operationId: deletePaymentLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: code
          in: path
          required: true
          description: Código único do link de pagamento
          schema:
            type: string
            example: "lnk_abc123xyz"
      responses:
        '200':
          description: Link de pagamento excluído com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                mensagem: "Link de pagamento excluído com sucesso"
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/payment-links/{code}/cancel:
    post:
      tags: [Links de Pagamento]
      summary: Cancelar link de pagamento
      description: >
        Cancela um link de pagamento ativo. Apenas links com status `InProgress` podem ser cancelados.
        Esta operação é irreversível — um link cancelado não pode ser reativado.
        Requer o header `account` com o código da conta.
      operationId: cancelPaymentLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountHeader'
        - name: code
          in: path
          required: true
          description: Código único do link de pagamento
          schema:
            type: string
            example: "lnk_abc123xyz"
      responses:
        '200':
          description: Link de pagamento cancelado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
              example:
                mensagem: "Link de pagamento cancelado com sucesso"
                erro: false
                mensagenserro: []
                codigoretorno: 200
                id: "00000000-0000-0000-0000-000000000000"
                data:
                  code: "lnk_abc123xyz"
                  order_code: "ord_abc123xyz"
                  token: "a1b2c3d4e5f6..."
                  url: null
                  status: "Canceled"
                  payment_types: ["CreditCard", "PIX"]
                  installments: []
                  obfuscate_client: false
                  obfuscate_items: false
                  expires_at: null
                  max_uses: null
                  uses_count: 7
                  split: []
                  value: 97.99
                  created_at: "2026-05-27T10:00:00.000000Z"
        '400':
          description: Link já cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                mensagem: "Link de pagamento já está cancelado."
                erro: true
                mensagenserro: ["Link de pagamento já está cancelado."]
                codigoretorno: 400
                id: "00000000-0000-0000-0000-000000000000"
                data: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────
  # ANÁLISE DE FRAUDE
  # ─────────────────────────────────────────────────────────────────

  /v1/fraud/risk-analyses:
    post:
      tags: [Análise de Fraude]
      summary: Analisar risco de uma transação
      description: >
        Avalia o risco de fraude de uma transação e devolve uma recomendação, uma nota de risco
        (0–100), o nível e os motivos. Cada análise concluída é cobrada. Autenticada pela chave de API.
      operationId: createRiskAnalysis
      security:
        - secretKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Chave de idempotência opcional. Repetir a mesma chave com o mesmo corpo devolve a análise
            original sem cobrar de novo; a mesma chave com corpo diferente retorna 422.
          schema:
            type: string
            example: order-9f2b1a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAnalysisRequest'
            example:
              external_reference: order-1024
              amount: 25000
              currency: BRL
              payment_method: credit_card
              customer:
                name: João Silva
                document: "12345678900"
                email: joao@exemplo.com.br
                phone: "+5511999998888"
              card:
                bin: "516292"
                last4: "0000"
                brand: mastercard
              context:
                ip: 189.10.20.30
                user_agent: MinhaLoja/1.0
      responses:
        '200':
          description: Análise concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAnalysis'
              example:
                object: risk_analysis
                id: fan_a1b2c3d4e5f6g7h8
                external_reference: order-1024
                status: completed
                risk_score: 30
                risk_level: low
                recommendation: follow
                decision: ALLOW
                reasons: [NEW_CUSTOMER]
                analyzed_at: "2026-07-27T12:00:00-03:00"
        '401':
          $ref: '#/components/responses/FraudUnauthorized'
        '402':
          description: Acesso suspenso por faturas de antifraude em aberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudError'
              example:
                error:
                  type: billing_error
                  code: payment_required
                  message: Antifraud API access is suspended due to an outstanding balance.
        '403':
          $ref: '#/components/responses/FraudProductDisabled'
        '422':
          description: Dados inválidos, campo de cartão proibido (número/CVV/validade) ou conflito de idempotência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudError'
              examples:
                validation_failed:
                  summary: Dados inválidos
                  value:
                    error:
                      type: invalid_request_error
                      code: validation_failed
                      message: The amount field is required.
                forbidden_card_field:
                  summary: Campo de cartão proibido
                  value:
                    error:
                      type: invalid_request_error
                      code: forbidden_card_field
                      message: The field [card.number] is not accepted. Send only the card bin and last four digits.
                idempotency_conflict:
                  summary: Conflito de idempotência
                  value:
                    error:
                      type: idempotency_error
                      code: idempotency_conflict
                      message: The Idempotency-Key was already used with a different payload.
        '503':
          description: Provedor de risco indisponível — repita com a mesma Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudError'
              example:
                error:
                  type: service_unavailable
                  code: analysis_unavailable
                  message: The analysis could not be completed. Retry with the same Idempotency-Key.

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT obtido via `POST /v1/login`. Envie no header `Authorization: Bearer <token>`."
    secretKeyAuth:
      type: http
      scheme: bearer
      description: >
        Chave de API (secret key) da conta, no formato `sk_live_...` (produção) ou `sk_test_...` (Dev mode).
        Envie no header `Authorization: Bearer <chave>`. Usada apenas nas rotas de Análise de Fraude.
        Gere a sua no dashboard em Configurações → Chaves de API.

  parameters:
    AccountHeader:
      name: account
      in: header
      required: true
      description: Código da conta à qual a operação se aplica
      schema:
        type: string
        example: "acc_abc123xyz"
    ClientCode:
      name: clientCode
      in: path
      required: true
      description: Código único do cliente dono do cartão
      schema:
        type: string
        example: "cli_abc123"
    CardId:
      name: cardId
      in: path
      required: true
      description: UUID do cartão
      schema:
        type: string
        format: uuid
        example: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"

  responses:
    FraudUnauthorized:
      description: Chave de API ausente, inválida ou revogada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FraudError'
          example:
            error:
              type: authentication_error
              code: invalid_api_secret
              message: Invalid API secret.
    FraudProductDisabled:
      description: Produto de antifraude não habilitado para a conta
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FraudError'
          example:
            error:
              type: authorization_error
              code: product_not_enabled
              message: The antifraud API is not enabled for this account.
    ValidationError:
      description: Erro de validação dos dados enviados
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            message: The given data was invalid.
            errors:
              client.email:
                - O campo client.email é obrigatório.
    Unauthorized:
      description: Não autorizado — token inválido ou ausente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensagem: Unauthenticated.
            erro: true
            mensagenserro: []
            codigoretorno: 401
            id: "00000000-0000-0000-0000-000000000000"
            data: []
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensagem: "The charge code does not match any charge"
            erro: true
            mensagenserro: []
            codigoretorno: 404
            id: "00000000-0000-0000-0000-000000000000"
            data: []
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensagem: "Um erro inesperado acabou de acontecer."
            erro: true
            mensagenserro:
              - "Detalhe do erro ocorrido."
            codigoretorno: 400
            id: "00000000-0000-0000-0000-000000000000"
            data: []
    ServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            mensagem: "Um erro aconteceu."
            erro: true
            mensagenserro:
              - "Erro interno. Tente novamente mais tarde."
            codigoretorno: 500
            id: "00000000-0000-0000-0000-000000000000"
            data: []

  schemas:

    # ── Análise de Fraude ─────────────────────────────────────────

    FraudError:
      type: object
      description: Envelope de erro das rotas de Análise de Fraude
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              example: invalid_request_error
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: The amount field is required.

    RiskAnalysisRequest:
      type: object
      required: [amount, currency]
      properties:
        external_reference:
          type: string
          maxLength: 191
          description: Seu identificador da transação (aparece na resposta)
          example: order-1024
        amount:
          type: integer
          minimum: 0
          description: Valor da transação em centavos (10000 = R$ 100,00)
          example: 25000
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Moeda no padrão ISO 4217 (3 letras)
          example: BRL
        payment_method:
          type: string
          maxLength: 30
          example: credit_card
        customer:
          type: object
          properties:
            name:
              type: string
              maxLength: 191
              example: João Silva
            document:
              type: string
              maxLength: 60
              description: CPF ou CNPJ, com ou sem máscara
              example: "12345678900"
            email:
              type: string
              format: email
              maxLength: 191
              example: joao@exemplo.com.br
            phone:
              type: string
              maxLength: 40
              example: "+5511999998888"
        card:
          type: object
          description: >
            Apenas BIN e últimos 4 dígitos. Enviar o número completo, o CVV ou a validade
            faz a requisição retornar 422 (`forbidden_card_field`).
          properties:
            bin:
              type: string
              description: 6 primeiros dígitos do cartão
              example: "516292"
            last4:
              type: string
              description: 4 últimos dígitos do cartão
              example: "0000"
            brand:
              type: string
              maxLength: 30
              example: mastercard
        context:
          type: object
          properties:
            ip:
              type: string
              description: Endereço IP do comprador
              example: 189.10.20.30
            user_agent:
              type: string
              maxLength: 512
              example: MinhaLoja/1.0

    RiskAnalysis:
      type: object
      description: Resultado de uma análise de risco
      properties:
        object:
          type: string
          example: risk_analysis
        id:
          type: string
          description: Código da análise (use-o para consultar depois)
          example: fan_a1b2c3d4e5f6g7h8
        external_reference:
          type: string
          nullable: true
          example: order-1024
        status:
          type: string
          enum: [completed, unavailable, failed]
          example: completed
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Nota de risco de 0 (baixo) a 100 (alto)
          example: 30
        risk_level:
          type: string
          enum: [low, medium, high]
          example: low
        recommendation:
          type: string
          nullable: true
          enum: [follow, additional_validation, reject]
          description: "Ação sugerida: seguir, validar melhor ou recusar"
          example: follow
        decision:
          type: string
          nullable: true
          enum: [ALLOW, CHALLENGE, DENY]
          description: "Decisão do motor: aprovar, revisar ou recusar"
          example: ALLOW
        reasons:
          type: array
          description: Códigos dos motivos que pesaram na decisão
          items:
            type: string
          example: [NEW_CUSTOMER]
        analyzed_at:
          type: string
          format: date-time
          example: "2026-07-27T12:00:00-03:00"

    # ── Links de Pagamento ────────────────────────────────────────

    CreatePaymentLinkRequest:
      type: object
      required: [items]
      description: >
        O objeto `client` é opcional. Se omitido, os dados do pagador serão coletados no checkout.
        Se qualquer campo de `client` for enviado, os campos `name`, `email`, `phone` e `document` tornam-se obrigatórios.
      properties:
        client:
          type: object
          required: [name, email, phone, document]
          properties:
            name:
              type: string
              maxLength: 255
              description: Nome completo do pagador
              example: "Hugo Belo"
            email:
              type: string
              format: email
              maxLength: 255
              description: E-mail do pagador
              example: "hugo@exemplo.com.br"
            phone:
              type: object
              required: [ddi, ddd, number]
              properties:
                ddi:
                  type: string
                  description: Código do país (DDI)
                  example: "55"
                ddd:
                  type: string
                  description: Código de área (DDD)
                  example: "62"
                number:
                  type: string
                  description: Número do telefone
                  example: "984063942"
            document:
              type: object
              required: [type, number]
              properties:
                type:
                  type: string
                  enum: [CPF, CNPJ, passport, undefined]
                  description: Tipo do documento
                  example: "CPF"
                number:
                  type: string
                  description: Número do documento (CPF/CNPJ validado com dígito verificador)
                  example: "71854312120"
            gender:
              type: string
              nullable: true
              enum: [Male, Female, Other, Undefined]
              description: Gênero (opcional)
            birthdate:
              type: string
              format: date
              nullable: true
              description: Data de nascimento (YYYY-MM-DD, opcional)
              example: "1993-07-07"
            address:
              type: object
              nullable: true
              description: Endereço (todos os campos obrigatórios entre si quando street é enviado)
              properties:
                zipcode:
                  type: string
                  maxLength: 20
                  example: "74715280"
                street:
                  type: string
                  maxLength: 255
                  example: "Rua Londrina"
                number:
                  type: string
                  maxLength: 20
                  example: "sn"
                neighborhood:
                  type: string
                  maxLength: 255
                  example: "Jd. Novo Mundo"
                complement:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "casa"
                city:
                  type: string
                  maxLength: 255
                  example: "Goiânia"
                state:
                  type: string
                  maxLength: 2
                  example: "GO"
                country:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "BR"
        items:
          type: array
          minItems: 1
          description: Produtos ou serviços incluídos no link. Total mínimo (itens + frete) = R$ 5,00.
          items:
            type: object
            required: [id, description, amount, quantity]
            properties:
              id:
                type: string
                description: Identificador do produto (SKU, UUID ou código)
                example: "plano-premium"
              description:
                type: string
                maxLength: 255
                description: Descrição exibida no checkout
                example: "Plano Mensal Premium"
              amount:
                type: number
                format: float
                minimum: 0.01
                maximum: 1000000
                description: Valor unitário em reais (ex. 97.99 = R$ 97,99)
                example: 97.99
              quantity:
                type: integer
                minimum: 1
                description: Quantidade de unidades
                example: 1
        config:
          type: object
          nullable: true
          description: Configurações opcionais do link
          properties:
            payment_types:
              type: array
              nullable: true
              description: Métodos exibidos no checkout. Se omitido, todos os ativos da conta são liberados.
              items:
                type: string
                enum: [CreditCard, PIX, Boleto]
              example: ["CreditCard", "PIX"]
            installments:
              type: array
              nullable: true
              description: >
                Opções de parcelamento por milestones. Cada milestone define a taxa para todas as parcelas
                desde o milestone anterior até o count informado. interest_rate é um fator multiplicador
                (1.0 = sem juros, 1.10 = 10% de acréscimo).
              items:
                type: object
                required: [count, interest_rate]
                properties:
                  count:
                    type: integer
                    minimum: 1
                    maximum: 12
                    description: Número de parcelas (milestone)
                    example: 6
                  interest_rate:
                    type: number
                    format: float
                    minimum: 1
                    description: Fator multiplicador (ex. 1.1047 = 10,47% de acréscimo total)
                    example: 1.1047
            expires_at:
              type: string
              format: date-time
              nullable: true
              description: Data/hora de expiração do link (YYYY-MM-DD HH:MM:SS). Deve ser futura. null = sem expiração.
              example: "2026-12-31 23:59:59"
            max_uses:
              type: integer
              nullable: true
              minimum: 1
              description: Número máximo de pagamentos aceitos. null = ilimitado.
              example: 100
            freight:
              type: number
              format: float
              nullable: true
              minimum: 0
              description: Valor do frete em reais adicionado ao total
              example: 15.90
            link_name:
              type: string
              nullable: true
              maxLength: 255
              description: Nome interno do link (não exibido no checkout)
              example: "Black Friday – Plano Premium"
            order_title:
              type: string
              nullable: true
              maxLength: 255
              description: Título exibido no cabeçalho do checkout
              example: "Plano Mensal Premium"
            soft_descriptor:
              type: string
              nullable: true
              maxLength: 22
              description: Texto exibido na fatura do cartão de crédito
              example: "MinhaLoja"
            image:
              type: string
              nullable: true
              description: >
                URL pública HTTPS ou string base64 da imagem exibida no topo do checkout.
                Tem prioridade sobre image_url. Processado automaticamente (fail-soft).
                Formatos aceitos: jpg, png, webp, gif.
              example: "https://exemplo.com/banner.jpg"
            image_url:
              type: string
              nullable: true
              maxLength: 1000
              description: URL de uma imagem já armazenada. Preterido quando image é enviado.
              example: "https://storage.exemplo.com/payment-links/images/banner.jpg"
            pix_expiration:
              type: integer
              nullable: true
              minimum: 1
              description: Tempo de vida do QR Code PIX em horas
              example: 24
            pix_discount_value:
              type: number
              format: float
              nullable: true
              minimum: 0
              description: Valor do desconto para pagamentos PIX
              example: 10
            pix_discount_type:
              type: string
              nullable: true
              enum: [percentage, fixed]
              description: >
                Tipo do desconto PIX. percentage = percentual sobre o total (0–100).
                fixed = valor fixo em reais. Exige PIX em payment_types.
              example: "percentage"
            obfuscate_client:
              type: boolean
              nullable: true
              description: Mascarar dados do pagador no checkout (iniciais, e-mail parcial, dígitos centrais substituídos)
              example: false
            obfuscate_items:
              type: boolean
              nullable: true
              description: Ocultar nomes e valores dos itens no checkout
              example: false
            # split:
            #   type: array
            #   nullable: true
            #   description: Divisão automática do recebimento entre recebedores
            #   items:
            #     type: object
            #     required: [receiver_code]
            #     properties:
            #       receiver_code:
            #         type: string
            #         description: Código do recebedor (account_receiver)
            #         example: "rec_abc123"
            #       percentage:
            #         type: number
            #         format: float
            #         nullable: true
            #         minimum: 0
            #         maximum: 100
            #         description: Percentual do total (exclusivo com amount)
            #         example: 80.00
            #       amount:
            #         type: number
            #         format: float
            #         nullable: true
            #         minimum: 0
            #         description: Valor fixo em reais (exclusivo com percentage)
            back_url:
              type: string
              format: uri
              nullable: true
              maxLength: 1000
              description: URL do botão "Voltar" exibido no checkout
              example: "https://meusite.com.br/planos"
            redirect_url:
              type: string
              format: uri
              nullable: true
              maxLength: 1000
              description: URL de redirecionamento automático após pagamento confirmado
              example: "https://meusite.com.br/obrigado"

    PaymentLinkData:
      type: object
      properties:
        code:
          type: string
          description: Código único do link de pagamento
          example: "lnk_abc123xyz"
        order_code:
          type: string
          nullable: true
          description: Código do pedido gerado na criação
          example: "ord_abc123xyz"
        token:
          type: string
          description: Token de segurança do checkout (64 caracteres hex)
          example: "a1b2c3d4e5f6..."
        url:
          type: string
          nullable: true
          description: URL completa do checkout para compartilhar com o cliente
          example: "https://checkout.4seletpay.com.br/lnk_abc123xyz?token=..."
        status:
          type: string
          description: Status atual do link
          enum: [InProgress, Canceled, Concluded]
          example: "InProgress"
        payment_types:
          type: array
          items:
            type: string
          description: Métodos de pagamento configurados
          example: ["CreditCard", "PIX"]
        installments:
          type: array
          description: Opções de parcelamento expandidas (uma entrada por parcela de 1 a 12)
          items:
            type: object
            properties:
              count:
                type: integer
                example: 1
              interest_rate:
                type: number
                format: float
                example: 1
        obfuscate_client:
          type: boolean
          description: Dados do pagador mascarados no checkout
          example: false
        obfuscate_items:
          type: boolean
          description: Itens ocultos no checkout
          example: false
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Data/hora de expiração ou null
          example: "2026-12-31T23:59:59.000000Z"
        max_uses:
          type: integer
          nullable: true
          description: Limite máximo de pagamentos ou null se ilimitado
          example: 100
        uses_count:
          type: integer
          description: Quantidade de pagamentos realizados via este link
          example: 0
        # split:
        #   type: array
        #   description: Configuração de split ou array vazio
        #   items:
        #     type: object
        value:
          type: number
          format: float
          description: Valor total do link em reais
          example: 97.99
        created_at:
          type: string
          format: date-time
          description: Data de criação (ISO 8601)
          example: "2026-05-27T10:00:00.000000Z"
        image_warning:
          type: string
          nullable: true
          description: Presente apenas quando o processamento da imagem falhou (fail-soft). Descreve o motivo.
          example: "Não foi possível processar a imagem: URL inacessível."

    PaymentLinkResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: "Link de pagamento criado com sucesso"
        erro:
          type: boolean
          example: false
        mensagenserro:
          type: array
          items:
            type: string
          example: []
        codigoretorno:
          type: integer
          example: 201
        id:
          type: string
          example: "00000000-0000-0000-0000-000000000000"
        data:
          $ref: '#/components/schemas/PaymentLinkData'

    # ── Cartões ───────────────────────────────────────────────────

    CartaoData:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID identificador do cartão
          example: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
        card_token:
          type: string
          description: >
            Identificador do cartão salvo, retornado ao salvar o cartão e no evento
            `card.token_created`. É o valor enviado em `payment.card.card_token` ao
            cobrar com o cartão salvo.
          example: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
        first_six_digits:
          type: string
          nullable: true
          description: Seis primeiros dígitos do cartão (BIN)
          example: "542501"
        last_four_digits:
          type: string
          nullable: true
          description: Quatro últimos dígitos do cartão
          example: "7793"
        brand:
          type: string
          description: Bandeira do cartão
          enum: [visa, mastercard, elo, amex, undefined]
          example: "mastercard"
        holder_name:
          type: string
          description: Nome do portador impresso no cartão
          example: "Tony Stark"
        exp_month:
          type: integer
          nullable: true
          description: Mês de validade (1–12)
          example: 1
        exp_year:
          type: integer
          nullable: true
          description: Ano de validade (YYYY)
          example: 2030
        type:
          type: string
          description: Tipo do cartão
          enum: [credit, debit]
          example: "credit"
        status:
          type: string
          description: Situação do cartão
          enum: [active, deleted]
          example: "active"
        tokenization_status:
          type: string
          description: >
            Situação da tokenização do cartão. `pending` enquanto está sendo processado,
            `tokenized` quando o cartão está pronto para cobranças e `failed` quando não foi
            possível tokenizá-lo. As transições `tokenized`/`failed` também são notificadas por
            webhook (`card.token_created` / `card.token_failed`).
          enum: [pending, tokenized, failed]
          example: "pending"
        created_at:
          type: string
          format: date-time
          description: Data de criação (ISO 8601)
          example: "2026-05-27T10:00:00-03:00"
        updated_at:
          type: string
          format: date-time
          description: Data da última atualização (ISO 8601)
          example: "2026-05-27T10:00:00-03:00"
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Data de exclusão (ISO 8601) — presente apenas em cartão excluído
          example: "2026-04-04T12:43:30-03:00"

    CartaoResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: "Cartão recebido. A tokenização foi iniciada; o resultado será enviado por webhook."
        erro:
          type: boolean
          example: false
        mensagenserro:
          type: array
          items:
            type: string
          example: []
        codigoretorno:
          type: integer
          example: 201
        id:
          type: string
          example: "00000000-0000-0000-0000-000000000000"
        data:
          $ref: '#/components/schemas/CartaoData'

    CartaoListResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: "Cartões listados com sucesso."
        erro:
          type: boolean
          example: false
        mensagenserro:
          type: array
          items:
            type: string
          example: []
        codigoretorno:
          type: integer
          example: 200
        id:
          type: string
          example: "00000000-0000-0000-0000-000000000000"
        data:
          type: object
          properties:
            cards:
              type: array
              items:
                $ref: '#/components/schemas/CartaoData'

    CreateCartaoRequest:
      type: object
      required: [name, number, month, year, security_code]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nome do portador impresso no cartão
          example: "Tony Stark"
        number:
          type: string
          description: Número do cartão (13–19 dígitos, validado por Luhn)
          example: "5425011234567793"
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Mês de validade
          example: 1
        year:
          type: integer
          description: Ano de validade (2 ou 4 dígitos; deve estar no futuro)
          example: 2030
        security_code:
          type: string
          description: Código de segurança (CVV, 3 ou 4 dígitos)
          example: "123"
        type:
          type: string
          enum: [credit, debit]
          default: credit
          description: Tipo do cartão
          example: "credit"
        flag:
          type: string
          enum: [visa, mastercard, elo, amex]
          description: Bandeira do cartão (opcional)
          example: "mastercard"

    UpdateCartaoRequest:
      type: object
      description: >
        Todos os campos são opcionais. O número e o código de segurança são imutáveis.
        Ao enviar a validade, `month` e `year` devem vir juntos.
      properties:
        name:
          type: string
          maxLength: 255
          description: Nome do portador impresso no cartão
          example: "Peter Parker"
        type:
          type: string
          enum: [credit, debit]
          description: Tipo do cartão
          example: "credit"
        flag:
          type: string
          enum: [visa, mastercard, elo, amex]
          description: Bandeira do cartão
          example: "mastercard"
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: Mês de validade (obrigatório junto com `year`)
          example: 12
        year:
          type: integer
          description: Ano de validade (obrigatório junto com `month`)
          example: 2030

    # ── Autenticação ──────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: E-mail do usuário (obrigatório)
          example: usuario@exemplo.com.br
        password:
          type: string
          format: password
          description: Senha do usuário (obrigatório)
          example: "suaSenha123"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Token de acesso Bearer JWT
          example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..."
        token_type:
          type: string
          description: Tipo do token
          example: Bearer
        expires_at:
          type: string
          format: date-time
          description: Data/hora de expiração do token
          example: "2026-04-11T12:00:00.000000Z"

    NewUserRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          description: Nome completo do usuário (obrigatório)
          example: "João Silva"
        email:
          type: string
          format: email
          description: E-mail do usuário (obrigatório)
          example: "joao@exemplo.com.br"
        password:
          type: string
          format: password
          description: Senha (obrigatório)
          example: "suaSenha123"
        password_confirmation:
          type: string
          format: password
          description: Confirmação da senha (obrigatório, deve ser igual a password)
          example: "suaSenha123"

    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: Identificador único do usuário
          example: "usr_abc123"
        name:
          type: string
          description: Nome completo do usuário
          example: "João Silva"
        email:
          type: string
          format: email
          description: E-mail do usuário
          example: "joao@exemplo.com.br"
        path_avatar:
          type: string
          nullable: true
          description: URL do avatar do usuário
          example: "https://sua-api.com/storage/avatars/joao.jpg"
        admin_profile_id:
          type: string
          nullable: true
          description: ID do perfil de administrador (null se não for admin)
          example: null
        preferences:
          type: object
          description: Preferências gerais do usuário
          example: {}
        app_preferences:
          type: object
          description: Preferências do aplicativo mobile
          example: {}

    # ── Cliente / Checkout ─────────────────────────────────────────

    ClientData:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
          description: Nome completo do cliente (obrigatório, máx. 255 caracteres)
          example: "João Silva"
        email:
          type: string
          format: email
          description: E-mail do cliente (obrigatório)
          example: "joao@exemplo.com.br"
        gender:
          type: string
          description: Gênero do cliente (opcional)
          enum: [Male, Female, Other, Undefined]
          example: Male
        birthdate:
          type: string
          format: date
          description: Data de nascimento no formato YYYY-MM-DD (opcional)
          example: "1990-01-15"
        phone:
          $ref: '#/components/schemas/PhoneData'
        document:
          $ref: '#/components/schemas/DocumentData'
        address:
          $ref: '#/components/schemas/AddressData'

    ClientDataWithIp:
      allOf:
        - $ref: '#/components/schemas/ClientData'
        - type: object
          properties:
            client_ip:
              type: string
              format: ipv4
              description: Endereço IP do cliente (opcional)
              example: "192.168.1.100"

    PhoneData:
      type: object
      required: [ddi, ddd, number]
      properties:
        ddi:
          type: string
          description: Código do país (DDI) — obrigatório
          example: "55"
        ddd:
          type: string
          description: Código de área (DDD) — obrigatório
          example: "11"
        number:
          type: string
          description: Número do telefone sem DDD — obrigatório
          example: "999999999"

    DocumentData:
      type: object
      properties:
        type:
          type: string
          description: Tipo do documento (opcional para checkout, obrigatório para assinaturas)
          enum: [CPF, CNPJ, passport, undefined]
          example: CPF
        number:
          type: string
          description: Número do documento (opcional para checkout, obrigatório para assinaturas)
          example: "123.456.789-09"

    AddressData:
      type: object
      description: Endereço do cliente (obrigatório se o objeto address for enviado)
      properties:
        zipcode:
          type: string
          description: CEP (obrigatório quando address é enviado)
          example: "01310-100"
        street:
          type: string
          description: Logradouro (obrigatório quando address é enviado)
          example: "Avenida Paulista"
        number:
          type: integer
          description: Número do endereço (obrigatório quando address é enviado)
          example: 1000
        neighborhood:
          type: string
          description: Bairro (obrigatório quando address é enviado, máx. 255 caracteres)
          example: "Bela Vista"
        complement:
          type: string
          description: Complemento (obrigatório quando address é enviado, máx. 255 caracteres)
          example: "Apto 42"
        city:
          type: string
          description: Cidade (obrigatório quando address é enviado, máx. 255 caracteres)
          example: "São Paulo"
        state:
          type: string
          description: UF com 2 letras (obrigatório quando address é enviado)
          maxLength: 2
          example: "SP"
        country:
          type: string
          description: País (opcional, máx. 255 caracteres)
          example: "Brasil"

    CardData:
      type: object
      description: >
        Dados do cartão. Envie os dados completos do cartão OU apenas `card_token`
        (cartão salvo). Quando `card_token` é informado, `number`, `name`, `month`,
        `year` e `security_code` tornam-se opcionais.


        O `card_token` **não** carrega o billing address. Ao cobrar com um cartão
        salvo, informe o billing address (`client.address`) na própria requisição.
      properties:
        card_token:
          type: string
          nullable: true
          description: >
            Token de um cartão salvo (o `card_token` retornado ao salvar o cartão
            e no evento `card.token_created`). Alternativa aos dados do cartão. Só é
            aceito se o cartão pertencer à mesma conta da cobrança (cartões de outra
            conta são rejeitados).
          example: "9b2f5c8e-3a1d-4f7b-8c6e-2d9a1b4c5e6f"
        number:
          type: string
          description: Número do cartão (obrigatório quando `card_token` não é enviado, mín. 13 dígitos)
          example: "4111111111111111"
        name:
          type: string
          description: Nome impresso no cartão (obrigatório quando `card_token` não é enviado)
          example: "JOAO SILVA"
        month:
          type: string
          description: Mês de validade MM (obrigatório quando `card_token` não é enviado)
          example: "12"
        year:
          type: string
          description: Ano de validade YY (obrigatório quando `card_token` não é enviado)
          example: "27"
        security_code:
          type: string
          description: Código de segurança CVV (obrigatório quando `card_token` não é enviado)
          example: "123"
        installments:
          type: integer
          description: Número de parcelas para CreditCard (mín. 1). Envie mesmo ao usar `card_token`.
          minimum: 1
          example: 1
        soft_descriptor:
          type: string
          nullable: true
          description: Descrição que aparecerá na fatura do cartão (opcional, 3-50 caracteres)
          minLength: 3
          maxLength: 50
          example: "MINHA LOJA"

    PaymentData:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Método de pagamento (obrigatório)
          enum: [CreditCard, PIX]
          example: CreditCard
        pix_expiration:
          type: integer
          description: Tempo de expiração do PIX em segundos (opcional, mín. 1)
          minimum: 1
          example: 3600
        card:
          $ref: '#/components/schemas/CardData'

    ItemData:
      type: object
      required: [id, description, amount, quantity]
      properties:
        id:
          type: string
          description: Referência externa do item (obrigatório)
          example: "produto_001"
        description:
          type: string
          description: Descrição do item (obrigatório, máx. 255 caracteres)
          maxLength: 255
          example: "Camiseta Premium"
        amount:
          type: number
          format: float
          description: Valor unitário do item (obrigatório). Para testes em PIX, valores acima de R$ 300,00 pode resultar em erro.
          example: 99.90
        quantity:
          type: integer
          description: Quantidade do item (obrigatório)
          minimum: 1
          example: 2

    CheckoutRequest:
      type: object
      required: [client, payment, items]
      properties:
        international:
          type: boolean
          nullable: true
          description: Indica se é uma transação internacional (opcional, padrão false)
          example: false
        client:
          $ref: '#/components/schemas/ClientData'
        payment:
          $ref: '#/components/schemas/PaymentData'
        items:
          type: array
          description: Lista de itens da compra (obrigatório, mín. 1 item)
          items:
            $ref: '#/components/schemas/ItemData'
          example:
            - id: "produto_001"
              description: "Camiseta Premium"
              amount: 99.90
              quantity: 2

    # ── Assinaturas ───────────────────────────────────────────────

    SubscriptionData:
      type: object
      required: [interval]
      properties:
        interval:
          type: integer
          description: Intervalo de cobrança em dias (obrigatório, 1-365)
          minimum: 1
          maximum: 365
          example: 30
        code:
          type: string
          nullable: true
          description: Código identificador da assinatura (opcional, definido pelo integrador)
          example: "plano_mensal_001"
        description:
          type: string
          nullable: true
          description: Descrição da assinatura (opcional)
          example: "Plano Mensal Premium"
        installments:
          type: integer
          nullable: true
          description: Parcelas por cobrança (obrigatório se CreditCard, 1-12)
          minimum: 1
          maximum: 12
          example: 1
        max_invoices:
          type: integer
          nullable: true
          description: Número máximo de faturas a serem geradas (opcional, mín. 1)
          minimum: 1
          example: 12
        minimum_price:
          type: integer
          nullable: true
          description: Preço mínimo em centavos (opcional)
          example: 9990
        start_date:
          type: string
          nullable: true
          description: "Data de início da cobrança (opcional, formato `Y-m-d H:i:s`, deve ser após amanhã)"
          example: "2026-04-01 00:00:00"
        billing_type:
          type: string
          nullable: true
          description: Tipo de cobrança da assinatura (opcional)
          enum: [prepaid]
          example: prepaid
        billing_day:
          type: integer
          nullable: true
          description: Dia do mês para cobrança (obrigatório se billing_type=exact_day, 1-31)
          minimum: 1
          maximum: 31
          example: 10
        discounts:
          type: object
          nullable: true
          description: Desconto a ser aplicado nas faturas (opcional)
          properties:
            cycles:
              type: integer
              description: Número de ciclos com desconto
              example: 3
            value:
              type: number
              description: Valor do desconto
              example: 10.0
            type:
              type: string
              description: Tipo do desconto
              enum: [percentage, flat]
              example: percentage
        increments:
          type: object
          nullable: true
          description: Acréscimo a ser aplicado nas faturas (opcional)
          properties:
            cycles:
              type: integer
              example: 2
            value:
              type: number
              example: 5.0
            type:
              type: string
              enum: [percentage, flat]
              example: flat
        metadata:
          type: object
          nullable: true
          description: Metadados adicionais em formato livre (opcional)
          example:
            origem: "site"
            campanha: "black-friday"

    PaymentDataSubscription:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Método de pagamento (obrigatório, CreditCard ou PIX)
          enum: [CreditCard, PIX]
          example: CreditCard
        pix_expiration:
          type: integer
          nullable: true
          description: Expiração do PIX em segundos (obrigatório se type=PIX)
          example: 3600
        card:
          type: object
          nullable: true
          description: Dados do cartão (obrigatório)
          properties:
            number:
              type: string
              description: Número do cartão (mín. 13 dígitos)
              example: "4111111111111111"
            name:
              type: string
              description: Nome no cartão
              example: "CARLOS FERREIRA"
            month:
              type: string
              description: Mês de validade
              example: "08"
            year:
              type: string
              description: Ano de validade
              example: "28"
            security_code:
              type: string
              description: CVV
              example: "456"
            soft_descriptor:
              type: string
              nullable: true
              description: Texto na fatura (opcional, máx. 50 caracteres)
              example: "MINHA EMPRESA"

    StoreSubscriptionRequest:
      type: object
      required: [client, subscription, payment, items]
      properties:
        international:
          type: boolean
          nullable: true
          description: Indica se é uma transação internacional (opcional)
          example: false
        client:
          $ref: '#/components/schemas/ClientDataWithIp'
        subscription:
          $ref: '#/components/schemas/SubscriptionData'
        payment:
          $ref: '#/components/schemas/PaymentDataSubscription'
        items:
          type: array
          description: Lista de itens da assinatura (obrigatório)
          items:
            $ref: '#/components/schemas/ItemData'

    ChangeCardRequest:
      type: object
      required: [name, number, month, year, security_code]
      properties:
        name:
          type: string
          description: Nome do titular do cartão (obrigatório)
          example: "CARLOS FERREIRA"
        number:
          type: string
          description: Número do cartão (obrigatório)
          example: "5500000000000004"
        month:
          type: string
          description: Mês de validade do cartão (obrigatório)
          example: "09"
        year:
          type: string
          description: Ano de validade do cartão (obrigatório)
          example: "29"
        security_code:
          type: string
          description: Código de segurança do cartão (obrigatório)
          example: "789"

    ChangePaymentMethodRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          description: Novo método de pagamento (obrigatório)
          enum: [CreditCard, PIX]
          example: PIX
        card:
          type: object
          nullable: true
          description: Dados do cartão (obrigatório se method=CreditCard)
          properties:
            name:
              type: string
              description: Nome no cartão
              example: "CARLOS FERREIRA"
            number:
              type: string
              description: Número do cartão
              example: "4111111111111111"
            month:
              type: string
              description: Mês de validade
              example: "12"
            year:
              type: string
              description: Ano de validade
              example: "28"
            security_code:
              type: string
              description: CVV
              example: "321"

    UpdateSubscriptionItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          nullable: true
          description: Nova quantidade do item (opcional, mín. 1)
          minimum: 1
          example: 2
        amount:
          type: integer
          nullable: true
          description: Novo valor em centavos (opcional, 0-1000000)
          minimum: 0
          maximum: 1000000
          example: 8990
        description:
          type: string
          nullable: true
          description: Nova descrição do item (opcional, máx. 255 caracteres)
          maxLength: 255
          example: "Acesso Premium Mensal - 2 usuários"

    # ── Faturas ───────────────────────────────────────────────────

    PayOverdueInvoiceRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          description: Método de pagamento para quitação (obrigatório)
          enum: [CreditCard, PIX]
          example: CreditCard
        card:
          type: object
          nullable: true
          description: Dados do cartão (obrigatório se method=CreditCard)
          properties:
            name:
              type: string
              description: Nome no cartão
              example: "CARLOS FERREIRA"
            number:
              type: string
              description: Número do cartão
              example: "4111111111111111"
            month:
              type: string
              description: Mês de validade
              example: "12"
            year:
              type: string
              description: Ano de validade
              example: "28"
            security_code:
              type: string
              description: CVV
              example: "321"

    PayOverdueInvoiceResponse:
      type: object
      description: >
        Resposta do pagamento de fatura em atraso. Esta rota NÃO usa o envelope APIReturnUtil;
        retorna diretamente os dados da cobrança criada.
      properties:
        invoice_code:
          type: string
          description: Código da fatura (pedido)
          example: "ord_xyz456"
        code:
          type: string
          description: Código da cobrança criada
          example: "chg_abc123"
        status:
          type: string
          description: Status da cobrança
          example: "Pending"
        amount:
          type: integer
          description: Valor da cobrança em centavos
          example: 9990
        canceled_amount:
          type: number
          description: Valor cancelado
          example: 0
        installments:
          type: integer
          description: Número de parcelas
          example: 1
        payment:
          type: object
          properties:
            type:
              type: string
              description: Tipo de pagamento
              example: "CreditCard"
            pix:
              type: object
              nullable: true
              description: Presente apenas quando type é PIX
              properties:
                qrcode_url:
                  type: string
                  example: "https://api.example.com/pix/qrcode"
                copy_paste:
                  type: string
                  example: "00020101021226..."
                expiration:
                  type: string
                  format: date-time
                  example: "2026-03-11T10:30:00.000000Z"
            card:
              type: object
              nullable: true
              description: Presente apenas quando type é CreditCard
              properties:
                id:
                  type: string
                  format: uuid
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    # ── Clientes Bloqueados ───────────────────────────────────────

    BlockClientsRequest:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          description: Tipo de dado para bloqueio (obrigatório)
          enum: [cpf, email]
          example: email
        data:
          type: array
          description: Lista de emails ou CPFs a bloquear (obrigatório)
          items:
            type: string
          example:
            - "spam@exemplo.com.br"
            - "fraude@exemplo.com.br"

    BlockedClientItem:
      type: object
