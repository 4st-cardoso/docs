          type: number
          format: float
          description: Valor da cobrança
          example: 199.80
        coin:
          type: string
          description: Moeda da transação
          example: "BRL"
        status:
          type: string
          description: Status da compra
          enum: [Pending, Challenged, Approved, Declined, Refunded, Canceled]
