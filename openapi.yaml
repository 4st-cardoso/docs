          type: string
          description: Nome do cliente
          example: "João Silva"
        email:
          type: string
          format: email
          description: E-mail do cliente
          example: "joao@exemplo.com.br"
        documents:
          type: array
          description: Documentos do cliente (filtrado pelo documento padrão)
          items:
            type: object
            properties:
